server {
    listen 80;
    server_name localhost;

    # Static files - this must be first for precedence
    location /static/ {
        alias /static/;
        # Important detailed configuration for proper handling of static files
        types {
            text/css css;
            text/javascript js;
            application/javascript js;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg svg+xml;
            image/gif gif;
        }
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://realchat_backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Add these headers to ensure Django knows the correct URL scheme
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
    }

    # Backend API
    location /api/ {
        proxy_pass http://realchat_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}